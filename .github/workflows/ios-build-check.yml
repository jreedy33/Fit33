name: iOS Build Check

on:
  push:
    branches: [main]
    paths: ['Fit33/**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode + diagnostics
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version
          xcrun simctl list runtimes available || true
          xcodebuild -project Fit33.xcodeproj -list || true

      - name: Clean build
        id: build
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          xcodebuild clean build \
            -project Fit33.xcodeproj \
            -scheme Fit33 \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail job on build failure
        run: |
          RC="${{ steps.build.outputs.rc }}"
          if [ "$RC" != "0" ] && [ -n "$RC" ]; then
            echo "::error::xcodebuild clean build failed (exit $RC). See ios-build-log artifact."
            exit 1
          fi
