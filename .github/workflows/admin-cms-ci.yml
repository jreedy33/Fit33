name: Admin CMS CI

on:
  push:
    branches: [main]
    paths: ['admin-cms/**']
  pull_request:
    branches: [main]
    paths: ['admin-cms/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-cms

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-cms/package-lock.json

      - run: npm ci
      - run: npm run build
