name: iOS Unit Tests

on:
  push:
    branches: [main]
    paths: ['Fit33/**', 'Fit33Tests/**', 'scripts/**']
  pull_request:
    branches: [main]
    paths: ['Fit33/**', 'Fit33Tests/**', 'scripts/**']

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run logic audit static checks
        run: python3 scripts/logic_audit_verify.py

  test:
    # Audit PR-26 (2026-07-26): the project file format (objectVersion 70)
    # requires Xcode 16+, but the workflow pinned Xcode 15.4 on macos-14 —
    # every run failed with "future Xcode project file format". Use the
    # newest Xcode 16.x available on the macos-15 image.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode + diagnostics
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          echo "=== xcodebuild -version ==="
          xcodebuild -version
          echo ""
          echo "=== Available iOS Simulator runtimes ==="
          xcrun simctl list runtimes available || true
          echo ""
          echo "=== Available iPhone devices ==="
          xcrun simctl list devices available | grep -i iphone || true
          echo ""
          echo "=== Project schemes ==="
          xcodebuild -project Fit33.xcodeproj -list || true

      - name: Resolve packages
        id: resolve
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          xcodebuild -resolvePackageDependencies \
            -project Fit33.xcodeproj \
            -scheme Fit33 \
            -skipPackagePluginValidation \
            2>&1 | tee resolve.log
          RC=${PIPESTATUS[0]}
          echo "resolve_rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          # Audit PR-26: no pinned OS version — pick whatever iPhone 16
          # simulator ships with the selected Xcode (generic destination
          # avoids the "iPhone 15 / OS 17.5 not installed" failure mode).
          xcodebuild test \
            -project Fit33.xcodeproj \
            -scheme Fit33 \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee xcodebuild.log
          RC=${PIPESTATUS[0]}
          echo "test_rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            xcodebuild.log
            resolve.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail job on real test/build failure
        run: |
          RESOLVE_RC="${{ steps.resolve.outputs.resolve_rc }}"
          TEST_RC="${{ steps.tests.outputs.test_rc }}"
          echo "resolve_rc=$RESOLVE_RC test_rc=$TEST_RC"
          if [ "$RESOLVE_RC" != "0" ] && [ -n "$RESOLVE_RC" ]; then
            echo "::error::Package resolution failed (exit $RESOLVE_RC). See xcodebuild-log artifact (resolve.log)."
            exit 1
          fi
          if [ "$TEST_RC" != "0" ] && [ -n "$TEST_RC" ]; then
            echo "::error::xcodebuild test failed (exit $TEST_RC). See xcodebuild-log artifact (xcodebuild.log)."
            exit 1
          fi
          echo "All steps passed."
