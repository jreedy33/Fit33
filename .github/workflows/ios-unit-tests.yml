name: iOS Unit Tests

on:
  push:
    branches: [main]
    paths: ['Fit33/**', 'Fit33Tests/**', 'scripts/**']
  pull_request:
    branches: [main]
    paths: ['Fit33/**', 'Fit33Tests/**', 'scripts/**']

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run logic audit static checks
        run: python3 scripts/logic_audit_verify.py

  test:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Fit33.xcodeproj \
            -scheme Fit33 \
            -skipPackagePluginValidation

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Fit33.xcodeproj \
            -scheme Fit33 \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tail -50

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
