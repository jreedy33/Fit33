name: iOS Syntax Check

on:
  push:
    branches: [main]
    paths: ['Fit33/**']
  pull_request:
    branches: [main]
    paths: ['Fit33/**']

jobs:
  check:
    # Audit PR-26 (2026-07-26): project format (objectVersion 70) needs
    # Xcode 16+; the old Xcode 15.4 pin failed every run.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode + diagnostics
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Build syntax check
        id: build
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project Fit33.xcodeproj \
            -scheme Fit33 \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipPackagePluginValidation \
            build CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee syntax.log
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload syntax log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-syntax-log
          path: syntax.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Fail job on syntax failure
        run: |
          RC="${{ steps.build.outputs.rc }}"
          if [ "$RC" != "0" ] && [ -n "$RC" ]; then
            echo "::error::Syntax check failed (exit $RC). See ios-syntax-log artifact."
            exit 1
          fi
